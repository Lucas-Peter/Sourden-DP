# ---------------------------------------------------------------------------
# SOURDEN — Cloudflare configuration
# ---------------------------------------------------------------------------
# The site deploys as a Cloudflare WORKER WITH STATIC ASSETS. That is the
# current equivalent of what a Pages project used to do, and it is what the
# Cloudflare dashboard creates when you connect a Git repository today.
#
# The three fields Cloudflare actually needs:
#   name                → must match the Worker project connected to this repo
#   compatibility_date  → Workers runtime version
#   assets.directory    → what used to be `pages_build_output_dir` for Pages
#
# IMPORTANT — do NOT reintroduce `pages_build_output_dir`.
# Workers Builds runs `wrangler deploy`, which does not understand that key:
# it finds no entry point and no assets directory and fails the whole build
# with "If there is code to deploy, you can either: Specify an entry-point …".
# ---------------------------------------------------------------------------

name = "sourden-dp"
compatibility_date = "2026-09-18"

# Worker script entry point. V1 implements the sourcing-request API:
#   POST /api/inquiry  → validate + Turnstile + Resend notification/confirmation
# See worker/index.js. Static assets are still served by Cloudflare's edge; the
# Worker is invoked ONLY for /api/* via `run_worker_first` below.
main = "./worker/index.js"

# Serve the Worker on its *.workers.dev URL as well as any custom domain.
workers_dev = true

# Give every non-production branch its own preview URL.
# Must also be enabled under the Worker's Build settings.
preview_urls = true

# ---------------------------------------------------------------------------
# Static assets
# ---------------------------------------------------------------------------
# Everything in `assets.directory` is uploaded and served from Cloudflare's
# edge. Requests that match an asset are FREE and UNLIMITED — they do not
# invoke (or bill) a Worker script. There is no script in V1 at all.

[assets]
directory = "./dist"

# HTML URL handling. With Astro `build.format: 'file'` (see astro.config.mjs)
# every page is emitted as `<route>.html`, and this setting produces exactly
# the clean, slash-less URLs documented in the spec (§33):
#
#   /services                        → 200  dist/services.html
#   /services/product-sourcing       → 200  dist/services/product-sourcing.html
#   /services.html, /services/       → 307  to /services   (canonicalised)
#
# Do not switch to `force-trailing-slash`: it would put a slash on every URL
# and contradict the route table.
html_handling = "auto-trailing-slash"

# Unmatched paths serve dist/404.html with a real 404 status, instead of
# Cloudflare's generic error page.
not_found_handling = "404-page"

# Route /api/* THROUGH the Worker first, so the script handles the inquiry
# endpoint while every other request goes straight to the static edge cache
# (free + unlimited, no Worker invocation). The Worker never serves assets, so
# no `ASSETS` binding is required.
run_worker_first = ["/api/*"]

# NOTE on `binding = "ASSETS"` — deliberately absent. With run_worker_first
# scoped to /api/*, the Worker only ever sees API requests and never needs to
# read static assets, so the binding is unnecessary.

# `_headers` and `_redirects` are supported natively for Workers with static
# assets, exactly as they were on Pages. Both files live in public/ and are
# copied into dist/ by the build — see public/_headers and public/_redirects.

# ---------------------------------------------------------------------------
# V1 sourcing-request backend — IMPLEMENTED (spec §36)
# ---------------------------------------------------------------------------
# `main` + `run_worker_first = ["/api/*"]` above now route POST /api/inquiry to
# worker/index.js. The Worker reads its secrets from the runtime environment:
#
#   RESEND_API_KEY       — Cloudflare Secret (encrypted). Sends the notification
#                          + confirmation email via Resend.
#   TURNSTILE_SECRET_KEY — Cloudflare Secret (encrypted). Verifies the Turnstile
#                          token server-side. Leave UNSET to disable protection
#                          (submissions still delivered, unprotected).
#
# Both are set in the Cloudflare dashboard (Worker → Settings → Variables and
# Secrets → Add), NOT in this file. See .dev.vars.example for local `wrangler dev`.
#
# The public Turnstile site key is a BUILD-time variable (PUBLIC_TURNSTILE_SITE_KEY)
# — it lives in .env / Cloudflare Build vars, because import.meta.env is inlined
# at build time (see .env.example). It must be set TOGETHER with
# TURNSTILE_SECRET_KEY, otherwise the form sends an empty token and the server
# rejects it (400).

# ---------------------------------------------------------------------------
# RESERVED — NOT used in V1 (out of scope). Uncomment only after the matching
# Cloudflare resource exists; otherwise the deploy fails on an unknown binding.
# D1 / R2 are intentionally NOT part of V1 (no database, no file uploads).
# ---------------------------------------------------------------------------

# [[d1_databases]]
# binding = "DB"
# database_name = "sourden-db"
# database_id = "<paste-id-from-wrangler-d1-create>"

# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "sourden-uploads"
